<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Sportiva — Charla Técnica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@300;400;600;700;900&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #0b1f5c;
        color: #0b1b4d;
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .font-display {
        font-family: "Big Shoulders Display", "Inter", sans-serif;
        font-weight: 900;
        letter-spacing: 0.01em;
        line-height: 0.95;
      }
      .scroll-y {
        overflow-y: auto;
        scrollbar-width: none;
      }
      .scroll-y::-webkit-scrollbar {
        display: none;
      }

      /* ───────── FONDOS ───────── */
      .bg-light {
        background:
          radial-gradient(
              circle,
              rgba(37, 99, 235, 0.13) 1.2px,
              transparent 1.6px
            )
            0 0 / 26px 26px,
          linear-gradient(135deg, #ffffff 0%, #eef4ff 100%);
      }
      .bg-dark {
        background:
          repeating-linear-gradient(
            115deg,
            rgba(255, 255, 255, 0.035) 0 2px,
            transparent 2px 46px
          ),
          linear-gradient(145deg, #1e40af 0%, #172a7a 45%, #0b1f5c 100%);
      }
      .blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(60px);
        pointer-events: none;
        animation: blobMove 14s ease-in-out infinite;
      }
      .stripe {
        position: absolute;
        pointer-events: none;
        transform: skewX(-14deg);
        animation: stripeDrift 9s ease-in-out infinite alternate;
      }

      /* ───────── ANIMACIONES ───────── */
      .a {
        animation-duration: var(--t, 0.75s);
        animation-delay: var(--d, 0s);
        animation-fill-mode: backwards;
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }
      .a-rise {
        animation-name: rise;
      }
      .a-left {
        animation-name: slideL;
      }
      .a-right {
        animation-name: slideR;
      }
      .a-pop {
        animation-name: pop;
        animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .a-flip {
        animation-name: flipIn;
      }
      .a-wipe {
        animation-name: wipe;
        animation-duration: var(--t, 0.9s);
      }
      .a-draw {
        animation-name: drawX;
        transform-origin: left center;
        animation-duration: var(--t, 1s);
      }
      .a-char {
        animation-name: charIn;
        animation-duration: 0.6s;
        animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .a-marker {
        animation-name: marker;
        animation-duration: 0.9s;
      }
      .a-fade {
        animation-name: fadeIn;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(54px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes slideL {
        from {
          opacity: 0;
          transform: translateX(-110px) skewX(10deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes slideR {
        from {
          opacity: 0;
          transform: translateX(110px) skewX(-10deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.3) rotate(-10deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes flipIn {
        from {
          opacity: 0;
          transform: perspective(800px) rotateY(-85deg) translateY(30px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes wipe {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      @keyframes drawX {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @keyframes charIn {
        from {
          opacity: 0;
          transform: translateY(80%) rotate(12deg) scale(0.6);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes marker {
        from {
          background-size: 0% 100%;
        }
        to {
          background-size: 100% 100%;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes floatY {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-16px);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes marquee {
        to {
          transform: translateX(-50%);
        }
      }
      @keyframes pulseRing {
        0% {
          transform: scale(1);
          opacity: 0.55;
        }
        100% {
          transform: scale(2.2);
          opacity: 0;
        }
      }
      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        15% {
          transform: scale(1.22);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.14);
        }
        60% {
          transform: scale(1);
        }
      }
      @keyframes riseUp {
        0% {
          transform: translateY(0) scale(0.6);
          opacity: 0;
        }
        15% {
          opacity: 0.9;
        }
        100% {
          transform: translateY(-340px) scale(1.1);
          opacity: 0;
        }
      }
      @keyframes blobMove {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(50px, -40px) scale(1.18);
        }
      }
      @keyframes stripeDrift {
        from {
          transform: skewX(-14deg) translateX(-30px);
        }
        to {
          transform: skewX(-14deg) translateX(40px);
        }
      }
      @keyframes numIn {
        from {
          opacity: 0;
          transform: perspective(300px) rotateX(-80deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes wobble {
        0%,
        100% {
          transform: rotate(-8deg);
        }
        50% {
          transform: rotate(8deg) translateY(-4px);
        }
      }
      @keyframes sweep {
        0% {
          transform: translateX(-135%) skewX(-14deg);
        }
        43% {
          transform: translateX(0) skewX(-14deg);
        }
        57% {
          transform: translateX(0) skewX(-14deg);
        }
        100% {
          transform: translateX(135%) skewX(-14deg);
        }
      }
      @keyframes shine {
        from {
          transform: translateX(-120%) skewX(-20deg);
        }
        to {
          transform: translateX(260%) skewX(-20deg);
        }
      }
      @keyframes bounceX {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(8px);
        }
      }

      .float {
        animation: floatY 5s ease-in-out infinite;
      }
      .float-slow {
        animation: floatY 8s ease-in-out infinite;
      }
      .spin-slow {
        animation: spin 22s linear infinite;
      }
      .spin-orbit {
        animation: spin 7s linear infinite;
      }
      .marquee {
        display: flex;
        width: max-content;
        animation: marquee 28s linear infinite;
      }
      .marquee-slow {
        animation-duration: 60s;
      }
      .beat {
        animation: beat 1.8s ease-in-out infinite;
      }
      .rise-up {
        animation: riseUp 5s ease-in infinite;
      }
      .pulse-ring {
        animation: pulseRing 2.2s ease-out infinite;
      }
      .wobble {
        animation: wobble 2.4s ease-in-out infinite;
      }
      .nudge {
        animation: bounceX 1.4s ease-in-out infinite;
      }

      /* Cortina de transición entre slides */
      .curtain {
        position: fixed;
        top: 0;
        left: -15%;
        width: 130%;
        height: 100%;
        z-index: 70;
        pointer-events: none;
        background: linear-gradient(120deg, #1d4ed8, #1e3a8a);
        animation: sweep 0.95s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      .curtain::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        width: 14px;
        background: #ec4899;
      }
      .curtain::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 34px;
        background: #ffffff;
      }

      /* Hover */
      .lift {
        transition:
          transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.3s;
      }
      .lift:hover {
        transform: translateY(-8px) rotate(-0.6deg);
      }
      .shiny {
        position: relative;
        overflow: hidden;
      }
      .shiny::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.35),
          transparent
        );
        transform: translateX(-120%) skewX(-20deg);
        pointer-events: none;
      }
      .shiny:hover::after {
        animation: shine 0.9s ease;
      }

      .marker-pink {
        background-image: linear-gradient(
          to top,
          #ec4899 0 0.26em,
          transparent 0.26em
        );
        background-repeat: no-repeat;
        background-size: 100% 100%;
      }

      /* Dato pendiente de cargar */
      .todo {
        color: #f59e0b !important;
        border-bottom: 1px dashed rgba(245, 158, 11, 0.7);
      }
      [data-theme="light"] .todo {
        color: #b45309 !important;
        border-bottom-color: rgba(180, 83, 9, 0.6);
      }

      @media (prefers-reduced-motion: reduce) {
        .a,
        .beat,
        .rise-up,
        .float,
        .float-slow,
        .spin-slow,
        .spin-orbit,
        .marquee,
        .pulse-ring,
        .wobble,
        .nudge,
        .blob,
        .stripe {
          animation: none !important;
        }
        .curtain {
          animation-duration: 0.01s;
        }
      }
      /* Ilustraciones animadas del termómetro */
      .ilu-svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }
      .ilu-svg [class*="t-"] {
        transform-box: fill-box;
        transform-origin: center;
      }
      .ilu-svg .t-beat {
        animation: tBeat 1.5s ease-in-out infinite;
      }
      .ilu-svg .t-swing {
        transform-box: view-box;
        transform-origin: 80px 12px;
        animation: tSwing 2.4s ease-in-out infinite;
      }
      .ilu-svg .t-roll {
        animation: tRoll 2.4s ease-in-out infinite;
      }
      .ilu-svg .t-dash {
        stroke-dasharray: 6 6;
        animation: tDash 1.1s linear infinite;
      }
      .ilu-svg .t-draw {
        stroke-dasharray: 170;
        animation: tDraw 2.2s ease-in-out infinite;
      }
      .ilu-svg .t-charge {
        animation: tCharge 1.8s ease-in-out infinite;
      }
      .ilu-svg .c2 {
        animation-delay: 0.25s;
      }
      .ilu-svg .c3 {
        animation-delay: 0.5s;
      }
      .ilu-svg .t-float {
        animation: tFloat 2.6s ease-in-out infinite;
      }
      .ilu-svg .f2 {
        animation-delay: -1.3s;
      }
      .ilu-svg .t-flicker {
        transform-origin: 50% 100%;
        animation: tFlicker 0.9s ease-in-out infinite;
      }
      .ilu-svg .t-flutter {
        animation: tFlutter 0.45s ease-in-out infinite;
      }
      .ilu-svg .t-blink {
        animation: tBlink 1.2s ease-in-out infinite;
      }
      .ilu-svg .t-spin {
        animation: tSpin 6s linear infinite;
      }
      @keyframes tBeat {
        0%,
        100% {
          transform: scale(1);
        }
        15% {
          transform: scale(1.12);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.07);
        }
      }
      @keyframes tSwing {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-14deg);
        }
      }
      @keyframes tRoll {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(9px);
        }
      }
      @keyframes tDash {
        to {
          stroke-dashoffset: -24;
        }
      }
      @keyframes tDraw {
        0% {
          stroke-dashoffset: 170;
        }
        65%,
        100% {
          stroke-dashoffset: 0;
        }
      }
      @keyframes tCharge {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes tFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      @keyframes tFlicker {
        0%,
        100% {
          transform: scale(1, 1);
        }
        50% {
          transform: scale(0.94, 1.07) skewX(2deg);
        }
      }
      @keyframes tFlutter {
        0%,
        100% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(0.6);
        }
      }
      @keyframes tBlink {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes tSpin {
        to {
          transform: rotate(360deg);
        }
      }
      .mercurio {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        transition: transform 0.7s cubic-bezier(0.22, 1.2, 0.36, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        .ilu-svg * {
          animation: none !important;
        }
      }

      textarea {
        scrollbar-width: thin;
        scrollbar-color: rgba(37, 99, 235, 0.35) transparent;
      }
      textarea::-webkit-scrollbar {
        width: 5px;
      }
      textarea::-webkit-scrollbar-thumb {
        background: rgba(37, 99, 235, 0.35);
        border-radius: 4px;
      }
      [data-theme="dark"] textarea {
        scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
      }
      .alto {
        height: 100vh;
        height: 100dvh;
      }
      @keyframes giroSale {
        from {
          transform: rotateY(0deg);
        }
        to {
          transform: rotateY(90deg);
        }
      }
      @keyframes giroEntra {
        from {
          transform: rotateY(-90deg);
        }
        to {
          transform: rotateY(0deg);
        }
      }
      .giro-sale {
        animation: giroSale 0.38s cubic-bezier(0.55, 0, 0.8, 0.4) forwards;
      }
      .giro-entra {
        animation: giroEntra 0.45s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      select option {
        color: #0b1f5c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback, useMemo } = React;

      /* ══════════════════════════════════════════════════════════
         CONFIGURACIÓN — editá acá el plantel y los partidos
         ══════════════════════════════════════════════════════════ */
      const CONFIG = {
        equipo: "SOCIEDAD SPORTIVA",
        categoria: "QUINTA",
        torneo: 'CRC "A" BONAERENSE 2026',
        // Jugadoras (las mismas de la charla pre torneo). Las primeras 11 arrancan en cancha.
        plantel: [
          "JULI",
          "AMPI",
          "CHARO",
          "DOLO",
          "DELFI",
          "JOAQUI",
          "JUANA",
          "LULI",
          "TIZI",
          "OLI",
          "FELI",
          "JOSE",
          "MORA",
          "PAZ",
          "VICKY",
          "MARIA",
          "MANU",
          "EMMA",
          "CATA",
          "MALE",
          "LUA",
        ],
        // Partidos del fixture. Cada uno guarda su propia charla (notas, imágenes, XI y videos).
        partidos: [
          {
            id: "los-cardos",
            rival: "LOS CARDOS R.C.",
            dia: "Jueves 29",
            hora: "12:20",
            cancha: "Cancha 2 · Sportiva",
            pdo: "PDO N° 1 · Zona B",
          },
          {
            id: "cuds",
            rival: "C.U.D.S. A",
            dia: "Viernes 30",
            hora: "09:00",
            cancha: "Cancha 2 · Sportiva",
            pdo: "PDO N° 5 · Zona B",
          },
          {
            id: "social-junin",
            rival: "CLUB SOCIAL DE JUNÍN",
            dia: "Viernes 30",
            hora: "15:40",
            cancha: "Cancha 2 · Sportiva",
            pdo: "PDO N° 8 · Zona B",
          },
        ],
        // Videos por defecto (archivos en la misma carpeta). Cada partido puede tener su propio link.
        videos: {
          ataque: "ConPelota.mp4",
          defensa: "SinPelota.mp4",
          ccof: "CCOfensivo.mp4",
          ccdef: "CCDefensivo.mp4",
        },
      };

      /* ── GUARDADO (en este navegador) ─────────────────────────── */
      const LS = "sportiva_partido_v3";
      const lsGet = (k, def) => {
        try {
          const v = localStorage.getItem(`${LS}:${k}`);
          return v === null ? def : JSON.parse(v);
        } catch (e) {
          return def;
        }
      };
      const lsSet = (k, v) => {
        try {
          localStorage.setItem(`${LS}:${k}`, JSON.stringify(v));
          return true;
        } catch (e) {
          return false;
        }
      };
      const lsKeys = (prefix) => {
        const out = [];
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(`${LS}:${prefix}`))
              out.push(k.slice(LS.length + 1));
          }
        } catch (e) {}
        return out;
      };

      // Las imágenes van a IndexedDB (entra mucho más que en localStorage)
      const IMG = (() => {
        let dbp = null;
        const abrir = () =>
          dbp ||
          (dbp = new Promise((res, rej) => {
            const r = indexedDB.open("sportiva_partido", 1);
            r.onupgradeneeded = () => r.result.createObjectStore("img");
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error);
          }));
        const tx = async (modo, fn) => {
          const db = await abrir();
          return new Promise((res, rej) => {
            const t = db.transaction("img", modo);
            const req = fn(t.objectStore("img"));
            t.oncomplete = () => res(req ? req.result : undefined);
            t.onerror = () => rej(t.error);
          });
        };
        return {
          get: (k) =>
            tx("readonly", (s) => s.get(k)).catch(() =>
              lsGet("img:" + k, null),
            ),
          set: (k, v) =>
            tx("readwrite", (s) => s.put(v, k)).catch(() =>
              lsSet("img:" + k, v),
            ),
          del: (k) =>
            tx("readwrite", (s) => s.delete(k)).catch(() =>
              lsSet("img:" + k, null),
            ),
          keys: () => tx("readonly", (s) => s.getAllKeys()).catch(() => []),
        };
      })();

      const useEsMovil = () => {
        const q = "(max-width: 1023px)";
        const [m, setM] = useState(() => window.matchMedia(q).matches);
        useEffect(() => {
          const mq = window.matchMedia(q);
          const f = () => setM(mq.matches);
          mq.addEventListener
            ? mq.addEventListener("change", f)
            : mq.addListener(f);
          return () =>
            mq.removeEventListener
              ? mq.removeEventListener("change", f)
              : mq.removeListener(f);
        }, []);
        return m;
      };

      const usePersist = (key, def) => {
        const [v, setV] = useState(() => lsGet(key, def));
        const set = (nv) =>
          setV((prev) => {
            const val = typeof nv === "function" ? nv(prev) : nv;
            lsSet(key, val);
            return val;
          });
        return [v, set];
      };

      const slugId = (s) =>
        String(s)
          .normalize("NFD")
          .replace(/[̀-ͯ]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "");

      /* Delay escalonado para animaciones de entrada */
      const d = (i = 0, base = 0.15, step = 0.1) => ({
        "--d": `${base + i * step}s`,
      });

      /* ── ICONOS ─────────────────────────────────────────────── */
      const icons = {
        left: <polyline points="15 18 9 12 15 6" />,
        right: <polyline points="9 18 15 12 9 6" />,
        users: (
          <>
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </>
        ),
        shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
        zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
        target: (
          <>
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="12" r="6" />
            <circle cx="12" cy="12" r="2" />
          </>
        ),
        trophy: (
          <>
            <polyline points="8 21 12 17 16 21" />
            <line x1="12" y1="17" x2="12" y2="11" />

      const I = {

      /* ── PIEZAS REUTILIZABLES (mismo estilo que la charla pre torneo) ── */
      const Logo = ({ size = 128, ring = true }) => (

      const SplitText = ({
        text,
        className = "",
        base = 0.1,

      }) => {
        let n = 0;

                <span
                  className="inline-block whitespace-nowrap"

                  {w.split("").map((ch, ci) => (
                    <span
                      key={ci}
                      className={`a a-char inline-block ${accent.includes(ch) ? accentClass : ""}`}
                      style={{ "--d": `${base + n++ * step}s` }}

                      {ch}
                    </span>
                  ))}
                </span>

            ))}

        );
      };

      const Eyebrow = ({ children, dark = false, delay = 0 }) => (
        <p
          className={`a a-left flex items-center gap-2 font-mono font-bold uppercase tracking-[0.25em] text-[10px] md:text-xs mb-2 ${dark ? "text-blue-200" : "text-blue-700"}`}

      /* Fondo + contenedor de cada slide */

      const Stage = ({ theme = "light", children }) => (
        <div
          data-theme={theme}
          className={`h-full w-full relative overflow-hidden ${theme === "dark" ? "bg-dark text-white" : "bg-light text-blue-950"}`}
        >
          {theme === "light" ? (
            <>
              <div

              <div

                className="stripe bg-blue-600/[0.05]"

            <>
              <div

              <div
                className="blob bg-sky-300/20"
                style={{
                  width: 320,

                  right: -40,

              <div
                className="stripe bg-white/[0.05]"
                style={{ top: 0, right: "8%", width: "10%", height: "100%" }}
              ></div>
              <div
                className="stripe bg-pink-500/[0.12]"
                style={{
                  top: 0,
                  right: "21%",
                  width: "1.2%",
                  height: "100%",
                  animationDelay: "-2s",

          <div className="relative z-10 h-full">{children}</div>

      /* Contenedor de alto completo para las diapositivas de trabajo */
      const Marco = ({ children, className = "" }) => (
        <div
          className={`h-full overflow-y-auto scroll-y lg:overflow-hidden px-4 md:px-10 pt-12 md:pt-14 pb-28 lg:pb-24 ${className}`}
        >
          <div className="max-w-7xl mx-auto min-h-full lg:h-full flex flex-col">
            {children}
          </div>
        </div>
      );

      const tema = (dark) =>
        dark
          ? {
              card: "bg-white/10 border border-white/20 backdrop-blur",
              titulo: "text-white",
              acento: "text-blue-200",
              sub: "text-blue-100",
              campo: "text-white placeholder:text-white/40",
              chip: "bg-white/10 border border-white/25 text-white",
            }
          : {
              card: "bg-white border border-blue-100 shadow-xl shadow-blue-900/10",
              titulo: "text-blue-900",
              acento: "text-blue-600",
              sub: "text-slate-600",
              campo: "text-blue-950 placeholder:text-slate-400",
              chip: "bg-blue-50 border border-blue-200 text-blue-900",
            };

      const Encabezado = ({ eyebrow, titulo, acento, dark, partido }) => (
        <header className="flex flex-wrap items-end justify-between gap-3 mb-4 md:mb-5 shrink-0">
          <div>
            <Eyebrow dark={dark}>{eyebrow}</Eyebrow>
            <h2
              className={`font-display uppercase text-4xl md:text-6xl ${dark ? "text-white" : "text-blue-900"}`}
            >
              <SplitText text={titulo} base={0.1} step={0.04} />
              {acento && (
                <>
                  {" "}
                  <span className={dark ? "text-blue-200" : "text-blue-600"}>
                    <SplitText text={acento} base={0.4} step={0.04} />
                  </span>
                </>
              )}
            </h2>
          </div>
          {partido && (
            <span
              className={`a a-pop inline-flex items-center gap-2 rounded-full px-4 py-2 font-bold text-xs md:text-sm uppercase ${dark ? "bg-white text-blue-800" : "bg-blue-700 text-white"}`}
              style={d(0, 0.5, 0)}
            >
              <span className="font-display text-pink-500 text-lg leading-none">
                VS
              </span>{" "}
              {partido.rival}
            </span>
          )}

      );

      /* Texto que se guarda solo */
      const Notas = ({
        storeKey,
        placeholder,
        dark,
        className = "",
        grande = false,
      }) => {
        const [v, setV] = usePersist(storeKey, "");
        const t = tema(dark);
        return (
          <textarea
            value={v}
            onChange={(e) => setV(e.target.value)}
            placeholder={placeholder}
            className={`w-full flex-1 bg-transparent outline-none resize-none leading-relaxed ${grande ? "text-base md:text-xl" : "text-sm md:text-base"} ${t.campo} ${className}`}
          />
        );
      };

      /* ══════════ VIDEOS: reproductor a pantalla completa con puntero láser ══════════ */

      // Reconoce archivos de la carpeta, links de YouTube y de Google Drive
      const tipoVideo = (url) => {
        const u = String(url || "").trim();
        if (!u) return null;
        const yt = u.match(
          /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/,
        );
        if (yt) {
          const t = u.match(/[?&](?:t|start)=(\d+)/);
          return { tipo: "youtube", id: yt[1], start: t ? t[1] : "" };
        }
        const dr = u.match(
          /drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]+)/,
        );
        if (dr) return { tipo: "drive", id: dr[1] };
        if (/^https?:\/\//i.test(u) && !/\.(mp4|webm|m4v|mov)(\?|#|$)/i.test(u))
          return { tipo: "externo", url: u };
        return { tipo: "archivo", url: u };
      };

      const mmss = (s) => {
        if (!isFinite(s)) return "0:00";
        const m = Math.floor(s / 60);
        const ss = Math.floor(s % 60);
        return `${m}:${String(ss).padStart(2, "0")}`;
      };

      const Reproductor = ({ fuente, titulo, cerrar }) => {
        const caja = useRef(null);
        const video = useRef(null);
        const yt = useRef(null);
        const lienzo = useRef(null);
        const trazo = useRef([]);
        const [laser, setLaser] = useState(fuente.tipo !== "drive");
        const [punto, setPunto] = useState(null);
        const [jugando, setJugando] = useState(true);
        const [t, setT] = useState(0);
        const [dur, setDur] = useState(0);
        const [vel, setVel] = useState(1);
        const [error, setError] = useState(false);
        const [barra, setBarra] = useState(true);
        const ocultar = useRef(null);
        const esArchivo = fuente.tipo === "archivo";

        // Al abrir: pantalla completa. Al salir de pantalla completa (Esc): se cierra.
        useEffect(() => {
          const el = caja.current;
          const pedir = el.requestFullscreen || el.webkitRequestFullscreen;
          if (pedir) {
            try {
              const r = pedir.call(el);
              if (r && r.catch) r.catch(() => {});
            } catch (e) {}
          }
          const onFs = () => {
            if (
              !document.fullscreenElement &&
              !document.webkitFullscreenElement
            )
              cerrar();
          };
          document.addEventListener("fullscreenchange", onFs);
          document.addEventListener("webkitfullscreenchange", onFs);
          return () => {
            document.removeEventListener("fullscreenchange", onFs);
            document.removeEventListener("webkitfullscreenchange", onFs);
          };
        }, []);

        const salir = () => {
          if (document.fullscreenElement || document.webkitFullscreenElement) {
            (document.exitFullscreen || document.webkitExitFullscreen).call(
              document,
            );
          } else cerrar();
        };

        const ytCmd = (func, args = []) => {
          if (yt.current && yt.current.contentWindow)
            yt.current.contentWindow.postMessage(
              JSON.stringify({ event: "command", func, args }),
              "*",
            );
        };

        const alternar = () => {
          if (esArchivo && video.current) {
            video.current.paused ? video.current.play() : video.current.pause();
          } else if (fuente.tipo === "youtube") {
            ytCmd(jugando ? "pauseVideo" : "playVideo");
            setJugando((v) => !v);
          }
        };
        const saltar = (s) => {
          if (esArchivo && video.current)
            video.current.currentTime = Math.max(
              0,
              Math.min(
                video.current.duration || 0,
                video.current.currentTime + s,
              ),
            );
        };
        const cuadro = (dir) => {
          if (esArchivo && video.current) {
            video.current.pause();
            video.current.currentTime = Math.max(
              0,
              video.current.currentTime + dir / 25,
            );
          }
        };
        const velocidad = (v) => {
          setVel(v);
          if (video.current) video.current.playbackRate = v;
        };

        // Teclado del reproductor (tiene prioridad sobre el de las diapositivas)
        useEffect(() => {
          const h = (e) => {
            const k = e.key;
            const usadas = [
              " ",
              "k",
              "K",
              "ArrowLeft",
              "ArrowRight",
              ",",
              ".",
              "p",
              "P",
              "Escape",
              "PageUp",
              "PageDown",
              "ArrowUp",
              "ArrowDown",
            ];
            if (!usadas.includes(k)) return;
            e.preventDefault();
            e.stopImmediatePropagation();
            if (k === " " || k === "k" || k === "K") alternar();
            else if (k === "ArrowLeft") saltar(-5);
            else if (k === "ArrowRight") saltar(5);
            else if (k === ",") cuadro(-1);
            else if (k === ".") cuadro(1);
            else if (k === "p" || k === "P") setLaser((v) => !v);
            else if (k === "Escape") salir();
            mostrarBarra();
          };
          window.addEventListener("keydown", h, true);
          return () => window.removeEventListener("keydown", h, true);
        });

        // La barra de controles se esconde sola mientras el video corre
        const mostrarBarra = () => {
          setBarra(true);
          clearTimeout(ocultar.current);
          ocultar.current = setTimeout(() => setBarra(false), 2500);
        };
        useEffect(() => () => clearTimeout(ocultar.current), []);

        // Estela del puntero láser
        useEffect(() => {
          let raf;
          const dibujar = () => {
            const c = lienzo.current;
            if (c) {
              const r = c.getBoundingClientRect();
              if (
                c.width !== Math.round(r.width) ||
                c.height !== Math.round(r.height)
              ) {
                c.width = Math.round(r.width);
                c.height = Math.round(r.height);
              }
              const ctx = c.getContext("2d");
              ctx.clearRect(0, 0, c.width, c.height);
              const ahora = performance.now();
              trazo.current = trazo.current.filter((p) => ahora - p.t < 700);
              const pts = trazo.current;
              ctx.lineCap = "round";
              ctx.lineJoin = "round";
              for (let i = 1; i < pts.length; i++) {
                const a = pts[i - 1];
                const b = pts[i];
                const vida = 1 - (ahora - b.t) / 700;
                ctx.strokeStyle = `rgba(255,32,32,${0.75 * vida})`;
                ctx.shadowColor = "rgba(255,0,0,0.9)";
                ctx.shadowBlur = 14 * vida;
                ctx.lineWidth = 2 + 7 * vida;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
              }
            }
            raf = requestAnimationFrame(dibujar);
          };
          raf = requestAnimationFrame(dibujar);
          return () => cancelAnimationFrame(raf);
        }, []);

        const mover = (e) => {
          mostrarBarra();
          if (!laser) return;
          const r = e.currentTarget.getBoundingClientRect();
          const p = { x: e.clientX - r.left, y: e.clientY - r.top };
          setPunto(p);
          trazo.current.push({ ...p, t: performance.now() });
        };

        const boton =
          "h-11 min-w-[44px] px-3 rounded-full flex items-center justify-center gap-2 font-bold text-xs uppercase tracking-wider transition";
        const iframe = fuente.tipo === "youtube" || fuente.tipo === "drive";

        return (
          <div
            ref={caja}
            data-noswipe
            className="fixed inset-0 z-[90] bg-black flex flex-col select-none"
            onMouseMove={mostrarBarra}
          >
            {/* Video */}
            <div className="relative flex-1 min-h-0">
              {esArchivo && (
                <video
                  ref={video}
                  src={fuente.url}
                  autoPlay
                  playsInline
                  className="absolute inset-0 w-full h-full object-contain bg-black"
                  onPlay={() => setJugando(true)}
                  onPause={() => (setJugando(false), setBarra(true))}
                  onTimeUpdate={(e) => setT(e.currentTarget.currentTime)}
                  onLoadedMetadata={(e) => (
                    setDur(e.currentTarget.duration),
                    (e.currentTarget.playbackRate = vel)
                  )}
                  onError={() => setError(true)}
                />
              )}
              {fuente.tipo === "youtube" && (
                <iframe
                  ref={yt}
                  title={titulo}
                  className="absolute inset-0 w-full h-full"
                  src={`https://www.youtube.com/embed/${fuente.id}?autoplay=1&enablejsapi=1&rel=0&modestbranding=1&playsinline=1${fuente.start ? `&start=${fuente.start}` : ""}`}
                  allow="autoplay; encrypted-media; picture-in-picture"
                  allowFullScreen
                ></iframe>
              )}
              {fuente.tipo === "drive" && (
                <iframe
                  title={titulo}
                  className="absolute inset-0 w-full h-full"
                  src={`https://drive.google.com/file/d/${fuente.id}/preview`}
                  allow="autoplay"
                  allowFullScreen
                ></iframe>
              )}

              {/* Capa para el láser y para pausar con un clic (en YouTube/Drive deja libre la barra de abajo del video) */}
              {(laser || esArchivo || fuente.tipo === "youtube") && (
                <div
                  className="absolute inset-x-0 top-0"
                  style={{
                    bottom: iframe ? 64 : 0,
                    cursor: laser ? "none" : "pointer",
                  }}
                  onMouseMove={mover}
                  onMouseLeave={() => setPunto(null)}
                  onClick={alternar}
                >
                  <canvas
                    ref={lienzo}
                    className="absolute inset-0 w-full h-full pointer-events-none"
                  ></canvas>
                  {laser && punto && (
                    <span
                      className="absolute pointer-events-none rounded-full"
                      style={{
                        left: punto.x,
                        top: punto.y,
                        width: 16,
                        height: 16,
                        transform: "translate(-50%,-50%)",
                        background:
                          "radial-gradient(circle, #fff 0 18%, #ff2a2a 34%, rgba(255,0,0,0.85) 55%, rgba(255,0,0,0) 72%)",
                        boxShadow: "0 0 18px 6px rgba(255,0,0,0.65)",
                      }}
                    ></span>
                  )}
                  {esArchivo && !jugando && !error && (
                    <span className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 rounded-full bg-white/15 border border-white/30 backdrop-blur flex items-center justify-center text-white pointer-events-none">
                      <span className="font-display text-xl tracking-widest">
                        PAUSA
                      </span>
                    </span>
                  )}
                </div>
              )}

              {error && (
                <div className="absolute inset-0 flex items-center justify-center p-6">
                  <div className="max-w-lg rounded-3xl bg-white text-blue-950 p-6 text-center">
                    <p className="font-display text-3xl uppercase text-blue-900">
                      No se encontró el video
                    </p>
                    <p className="mt-2 text-sm">
                      Buscaba <b>{fuente.url}</b>. Tiene que estar en la misma
                      carpeta que <b>index.html</b>, con ese nombre exacto
                      (mayúsculas incluidas). También podés pegar un link de
                      YouTube o Drive con el botón del eslabón.
                    </p>
                    <button
                      onClick={salir}
                      className="mt-4 rounded-full bg-blue-700 text-white font-bold px-5 py-2"
                    >
                      Cerrar
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* Arriba: título, láser y cerrar */}
            <div
              className={`absolute top-0 inset-x-0 p-3 md:p-4 flex items-center gap-3 bg-gradient-to-b from-black/70 to-transparent transition-opacity ${barra || !jugando ? "opacity-100" : "opacity-0"}`}
            >
              <span className="w-2 h-2 rounded-full bg-pink-500"></span>
              <p className="font-display uppercase text-white text-xl md:text-2xl truncate flex-1">
                {titulo}
              </p>
              <button
                onClick={() => setLaser((v) => !v)}
                className={`${boton} ${laser ? "bg-red-600 text-white" : "bg-white/15 text-white hover:bg-white/25"}`}

                <Ico d={I.x} size={16} /> Cerrar

            {/* Abajo: controles (solo para archivos de video) */}
            {esArchivo && !error && (
              <div
                className={`absolute bottom-0 inset-x-0 p-3 md:p-4 bg-gradient-to-t from-black/80 to-transparent transition-opacity ${barra || !jugando ? "opacity-100" : "opacity-0"}`}
              >
                <input
                  type="range"
                  min="0"
                  max={dur || 0}

                  value={t}

                    video.current &&

                />
                <div className="mt-2 flex flex-wrap items-center gap-2">
                  <button
                    onClick={alternar}

                    title="Pausa / seguir (Espacio)"

                    {jugando ? "❚❚" : <Ico d={I.play} size={20} />}
                  </button>
                  <button

            {iframe && (

                className={`absolute bottom-20 left-1/2 -translate-x-1/2 rounded-full bg-black/70 text-white/80 text-xs px-4 py-2 transition-opacity pointer-events-none ${barra ? "opacity-100" : "opacity-0"}`}
              >
                {fuente.tipo === "youtube"

            )}
          </div>
        );
      };

      /* Botón de video: abre el reproductor (archivo de la carpeta, YouTube o Drive) */
      const Video = ({ rid, seccion, label, dark, rosa, partido }) => {
        const [link, setLink] = usePersist(`${rid}:video_${seccion}`, "");
        const [editar, setEditar] = useState(false);
        const [abierto, setAbierto] = useState(false);
        const fuente = tipoVideo(link.trim() || CONFIG.videos[seccion]);
        const abrir = () => {
          if (fuente && fuente.tipo === "externo")

        };
        return (
          <div className="shrink-0">
            <div className="flex gap-2">
              <button
                onClick={abrir}
                className={`flex-1 inline-flex items-center justify-center gap-2 rounded-2xl py-3 px-4 font-bold text-xs md:text-sm uppercase tracking-wider shadow-lg transition hover:scale-[1.02] ${
                  rosa
                    ? "bg-pink-500 text-white shadow-pink-900/20"
                    : dark

                      : "bg-blue-700 text-white shadow-blue-900/20"

                <Ico d={I.play} size={14} /> {label}

              <button
                onClick={() => setEditar((v) => !v)}

                <Ico d={I.link} size={16} />

            </div>
            {editar && (
              <div className="mt-2">
                <input
                  autoFocus
                  value={link}
                  onChange={(e) => setLink(e.target.value)}
                  placeholder={`Link de YouTube/Drive o nombre de archivo (vacío = ${CONFIG.videos[seccion]})`}
                  className={`w-full rounded-xl px-3 py-2 text-xs outline-none ${dark ? "bg-white/10 border border-white/25 text-white placeholder:text-white/40" : "bg-white border border-blue-200 text-blue-950 placeholder:text-slate-400"}`}
                />
                <p
                  className={`mt-1 text-[10px] ${dark ? "text-blue-100/70" : "text-slate-500"}`}

      /* ══════════════════════ DIAPOSITIVAS ══════════════════════ */

      /* 0 — Inicio: elegir el partido */
      const Inicio = ({
        rid,
        partido,
        partidos,
        elegir,
        agregar,
        quitar,
        exportar,
        importar,
      }) => {
        const [nuevo, setNuevo] = useState("");
        const archivo = useRef();
        return (
          <Stage theme="dark">
            <div className="h-full overflow-y-auto scroll-y px-5 pt-12 pb-28">
              <div className="min-h-full max-w-6xl mx-auto flex flex-col items-center justify-center text-center">
                <div
                  className="a a-pop relative float"
                  style={{ ...d(0, 0.1, 0), "--t": "1s" }}
                >
                  <div
                    className="absolute rounded-full border border-white/30 pulse-ring"
                    style={{ inset: -12 }}
                  ></div>
                  <div
                    className="absolute rounded-full border border-pink-400/50 pulse-ring"
                    style={{ inset: -12, animationDelay: "-1.1s" }}
                  ></div>
                  <div className="absolute spin-orbit" style={{ inset: -22 }}>
                    <span className="absolute top-0 left-1/2 -translate-x-1/2 w-3 h-3 rounded-full bg-pink-500 shadow-[0_0_16px_4px_rgba(236,72,153,0.7)]"></span>
                  </div>
                  <Logo size={104} />
                </div>
                <p
                  className="a a-fade mt-7 font-mono font-bold text-[10px] md:text-xs tracking-[0.3em] uppercase text-blue-200"
                  style={d(0, 0.4, 0)}
                >
                  {CONFIG.equipo} · {CONFIG.categoria} · {CONFIG.torneo}
                </p>
                <h1
                  className="font-display text-white mt-2"
                  style={{
                    fontSize: "clamp(3.5rem, 10vw, 8.5rem)",
                    textShadow: "0 12px 50px rgba(5,15,70,0.6)",
                  }}
                >
                  <SplitText text="CHARLA" base={0.4} step={0.06} />{" "}
                  <span className="text-blue-200">
                    <SplitText text="TÉCNICA" base={0.75} step={0.06} />
                  </span>
                </h1>

                <div
                  key={rid}
                  className="a a-pop mt-3 inline-flex items-center gap-3 rounded-full bg-white px-6 py-3 shadow-2xl shadow-blue-950/40"
                  style={d(0, 1.1, 0)}
                >
                  <span className="font-display text-pink-500 text-3xl leading-none">
                    VS
                  </span>
                  <span
                    className="font-display text-blue-800 uppercase leading-none"
                    style={{ fontSize: "clamp(1.6rem, 3.5vw, 2.6rem)" }}
                  >
                    {partido ? partido.rival : "ELEGÍ UN RIVAL"}
                  </span>
                </div>
                {partido && (partido.dia || partido.hora) && (
                  <p
                    key={rid + "i"}
                    className="a a-fade mt-3 text-sm md:text-base text-blue-100 font-semibold"
                    style={d(0, 1.3, 0)}
                  >
                    {[partido.dia, partido.hora, partido.cancha, partido.pdo]
                      .filter(Boolean)
                      .join(" · ")}
                  </p>
                )}

                {/* Selector de partido */}
                <div className="a a-rise mt-8 w-full" style={d(0, 1.5, 0)}>
                  <p className="font-mono font-bold text-[10px] md:text-xs tracking-[0.25em] uppercase text-blue-200 mb-3">
                    Elegí el partido · cada uno guarda su propia charla
                  </p>
                  <div className="flex flex-wrap justify-center gap-3">
                    {partidos.map((p) => {
                      const on = p.id === rid;
                      return (
                        <div key={p.id} className="relative">
                          <button
                            onClick={() => elegir(p.id)}
                            className={`lift text-left rounded-2xl px-4 py-3 min-w-[190px] transition ${on ? "bg-white text-blue-900 ring-4 ring-pink-400/70 shadow-2xl" : "bg-white/10 border border-white/25 text-white hover:bg-white/20"}`}
                          >
                            <span
                              className={`block font-mono text-[10px] font-bold uppercase tracking-[0.2em] ${on ? "text-pink-500" : "text-blue-200"}`}
                            >
                              {p.dia ? `${p.dia} · ${p.hora}` : "Otro partido"}
                            </span>
                            <span className="block font-display uppercase text-xl md:text-2xl leading-tight">
                              {p.rival}

                          {p.extra && (

                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        if (nuevo.trim()) (agregar(nuevo.trim()), setNuevo(""));
                      }}
                      className="flex items-center gap-2 rounded-2xl border-2 border-dashed border-white/30 px-3 py-2 min-w-[220px]"
                    >
                      <input
                        value={nuevo}
                        onChange={(e) => setNuevo(e.target.value)}

                        className="flex-1 bg-transparent outline-none text-white placeholder:text-white/40 font-bold uppercase text-sm"
                      />
                      <button

                      >
                        <Ico d={I.plus} size={16} />

                  </div>
                </div>

                <div
                  className="a a-fade mt-6 flex flex-wrap justify-center items-center gap-3 text-xs"
                  style={d(0, 1.8, 0)}
                >
                  <span className="text-blue-200">
                    Todo se guarda solo en este navegador.
                  </span>
                  <span className="sm:hidden w-full text-blue-200 font-bold">
                    Deslizá hacia el costado o usá los botones para pasar.
                  </span>
                  <button
                    onClick={exportar}
                    className="inline-flex items-center gap-2 rounded-full bg-white/10 border border-white/25 text-white font-bold px-4 py-2 hover:bg-white/20"
                  >
                    <Ico d={I.download} size={14} /> Guardar copia
                  </button>
                  <button
                    onClick={() => archivo.current.click()}
                    className="inline-flex items-center gap-2 rounded-full bg-white/10 border border-white/25 text-white font-bold px-4 py-2 hover:bg-white/20"
                  >
                    <Ico d={I.upload} size={14} /> Cargar copia
                  </button>
                  <input
                    ref={archivo}
                    type="file"
                    accept="application/json,.json"
                    className="hidden"

                      importar(e.target.files[0]),
                      (e.target.value = "")
